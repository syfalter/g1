g1_shadow_trajectory_executor:
  ros__parameters:
    state_topic: /lowstate
    trajectory_topic: /g1/shadow_executor/trajectory
    output_topic: /g1/shadow_executor/commanded_joint_states
    diagnostics_topic: /g1/shadow_executor/diagnostics
    update_rate_hz: 50.0
    state_timeout_s: 0.10
    start_tolerance_rad: 0.10
    tracking_error_limit_rad: 0.15
    max_velocity_rad_s: 0.50
    max_acceleration_rad_s2: 0.75
    joint_limit_margin_rad: 0.02
    enforce_tracking_error: false
    expected_mode_machine: 6
    expected_arm_motor_mode: 1
